server {
    listen 80;
    server_name eceexams.online;

    # Serve the static files of the React app
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle client-side routing (e.g., for React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to the backend container
    # Any request to "https://dubem1.getmusterup.com/predict" will be forwarded
    location /predict {
        # The 'backend' name comes from the service name in docker-compose.yml
        proxy_pass http://backend:9050;
        
        # Set headers to pass necessary information to the backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
